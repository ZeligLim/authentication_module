spring:
  datasource:
    url: jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  mail:
    host: localhost
    port: 1025
    username: dev
    password: dev
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dev-google-client-id
            client-secret: dev-google-client-secret
          facebook:
            client-id: dev-facebook-client-id
            client-secret: dev-facebook-client-secret
          apple:
            provider: apple-oidc
            client-id: dev-apple-client-id
            client-secret: dev-apple-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/apple"
            scope: name,email
        provider:
          apple-oidc:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            user-info-uri: https://appleid.apple.com/auth/userinfo
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub

app:
  base-url: http://localhost:8080
  name: Auth Module Dev

mfa:
  sms:
    provider: log

jwt:
  secret: dev-jwt-secret-key-min-32-chars-long!!

webauthn:
  rp:
    id: localhost
  origin: http://localhost:8080
